# Render.com Cloud Deployment Blueprint
# 100% Free Tier Web Service
services:
  - type: web
    name: skantha-wms
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m waitress --listen=0.0.0.0:$PORT webapp.app:app
    plan: free
    autoDeploy: true
    region: oregon
    healthCheckPath: /api/cameras
    envVars:
      - key: PORT
        value: 10000
      - key: VISION_MODEL_NAME
        value: yolo11n.pt
      - key: PYTHONUNBUFFERED
        value: "1"
