<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Set a New Password &mdash; W.A.R.L.O.G.</title>
    <script src="{{ url_for('static', filename='js/security.js') }}?v=1"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080e20; --card: rgba(15, 23, 42, 0.92); --line: #334155;
            --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8; --error: #f87171; --ok: #34d399;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 16px; color: var(--text);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg) url("{{ url_for('static', filename='bg.jpg') }}") no-repeat center center / cover fixed;
        }
        .card {
            width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line);
            border-radius: 16px; padding: 32px 28px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        }
        .brand { font-weight: 800; letter-spacing: 1px; color: var(--accent); font-size: 0.9rem; margin-bottom: 18px; }
        h1 { font-size: 1.35rem; margin: 0 0 8px; }
        p.lead { color: var(--muted); font-size: 0.92rem; line-height: 1.5; margin: 0 0 22px; }
        label { display: block; font-size: 0.82rem; font-weight: 600; color: #cbd5e1; margin: 14px 0 6px; }
        input {
            width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
            background: #0b1224; color: var(--text); font-size: 0.95rem; font-family: inherit;
        }
        input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
        .hint { color: var(--muted); font-size: 0.78rem; margin-top: 6px; }
        button {
            width: 100%; margin-top: 22px; padding: 12px; border: none; border-radius: 10px; cursor: pointer;
            background: var(--accent); color: #0b1224; font-weight: 800; font-size: 0.95rem; font-family: inherit;
        }
        button:disabled { opacity: 0.6; cursor: wait; }
        .msg { display: none; margin-top: 16px; padding: 10px 12px; border-radius: 8px; font-size: 0.86rem; }
        .msg.error { display: block; background: rgba(248, 113, 113, 0.12); border: 1px solid rgba(248, 113, 113, 0.4); color: var(--error); }
        .msg.ok { display: block; background: rgba(52, 211, 153, 0.12); border: 1px solid rgba(52, 211, 153, 0.4); color: var(--ok); }
        .signout { display: block; text-align: center; margin-top: 18px; color: var(--muted); font-size: 0.82rem; }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand">W.A.R.L.O.G.</div>
        <h1>Set a new password</h1>
        <p class="lead">
            The password for <strong>{{ username }}</strong> is a default or easy-to-guess one.
            Choose a new password to continue. Other devices signed in to this account will be signed out.
        </p>
        <form id="resetForm" novalidate>
            <label for="newPassword">New password</label>
            <input id="newPassword" type="password" autocomplete="new-password" required minlength="10">
            <div class="hint">At least 10 characters. Not your username or company name.</div>
            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword" type="password" autocomplete="new-password" required minlength="10">
            <button id="submitBtn" type="submit">Save password and continue</button>
            <div id="msg" class="msg" role="alert"></div>
        </form>
        <a class="signout" href="/logout">Sign out instead</a>
    </main>
    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msg');
            const btn = document.getElementById('submitBtn');
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            msg.className = 'msg';
            if (newPassword !== confirmPassword) {
                msg.textContent = 'The two passwords do not match.';
                msg.className = 'msg error';
                return;
            }
            btn.disabled = true;
            try {
                const res = await fetch('/api/auth/force_reset_password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ new_password: newPassword, confirm_password: confirmPassword })
                });
                const data = await res.json();
                if (data.success) {
                    msg.textContent = 'Password saved. Opening WARLOG...';
                    msg.className = 'msg ok';
                    window.location.href = '/';
                } else if (res.status === 401) {
                    window.location.href = '/login';
                } else {
                    msg.textContent = data.message || 'Could not save the password.';
                    msg.className = 'msg error';
                }
            } catch (err) {
                msg.textContent = 'Network error. Check the server connection and try again.';
                msg.className = 'msg error';
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
