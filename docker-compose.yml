services:
  skantha-wms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skantha_wms_prod
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - THREADS=8
      - VISION_MODEL_NAME=yolo11s.pt
      - PYTHONUNBUFFERED=1
    volumes:
      # Persist SQLite Database across container rebuilds
      - ./webapp/skandha_wms.db:/app/webapp/skandha_wms.db
      # Persist SKU image uploads
      - ./webapp/static/uploads:/app/webapp/static/uploads
    # Enable NVIDIA CUDA GPU passthrough if NVIDIA Container Toolkit is installed
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
